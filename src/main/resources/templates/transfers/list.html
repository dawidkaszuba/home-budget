<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4">
<head>
    <meta charset="UTF-8">
    <title>Przelewy wewnętrzne</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
</head>
<body>

<div th:insert="~{fragments/navbar}"></div>

<div class="container mt-4">

    <div class="row mb-3">
        <div class="col-12 col-md-6">
            <h1 class="h3">Przelewy wewnętrzne</h1>
        </div>
        <div class="col-12 col-md-6 text-md-right">
            <a th:href="@{/transfers/new}"
               class="btn btn-primary btn-sm btn-block btn-md-inline">
                🔄 Nowy przelew
            </a>
        </div>
    </div>

    <!-- DESKTOP TABLE -->
    <div class="d-none d-md-block">
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="thead-dark">
                <tr>
                    <th>Kwota</th>
                    <th>Z konta</th>
                    <th>Na konto</th>
                    <th>Uwagi</th>
                    <th>Data</th>
                    <th class="text-center">Akcje</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="transfer : ${transfers}">
                    <td class="font-weight-bold"
                        th:text="${#numbers.formatDecimal(transfer.value, 1, 'POINT', 2, 'POINT')} + ' zł'">
                    </td>
                    <td th:text="${transfer.sourceAccountName}"></td>
                    <td th:text="${transfer.targetAccountName}"></td>
                    <td th:text="${transfer.note}"></td>
                    <td th:text="${#temporals.format(transfer.createdAt, 'dd-MM-yyyy HH:mm')}"></td>
                    <td class="text-center">
                        <form th:action="@{/transfers/delete/{id}(id=${transfer.id})}"
                              method="post"
                              class="d-inline"
                              onsubmit="return confirm('Czy na pewno usunąć przelew?')">
                            <input type="hidden" name="_method" value="delete"/>
                            <button type="submit" class="btn btn-danger btn-sm">🗑</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MOBILE CARDS -->
    <div class="d-block d-md-none">
        <div class="card mb-3 shadow-sm" th:each="transfer : ${transfers}">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 font-weight-bold"
                        th:text="${#numbers.formatDecimal(transfer.value, 1, 'POINT', 2, 'POINT')} + ' zł'">
                    </h5>
                </div>
                <div class="mt-2 small text-muted">
                    <div>➡️ <span th:text="${transfer.sourceAccountName}"></span> → <span th:text="${transfer.targetAccountName}"></span></div>
                    <div th:if="${transfer.note}">📝 <span th:text="${transfer.note}"></span></div>
                    <div>📅 <span th:text="${#temporals.format(transfer.createdAt, 'dd-MM-yyyy HH:mm')}"></span></div>
                </div>
                <div class="mt-3">
                    <form th:action="@{/transfers/delete/{id}(id=${transfer.id})}"
                          method="post"
                          onsubmit="return confirm('Czy na pewno usunąć przelew?')">
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit" class="btn btn-danger btn-sm btn-block">🗑 Usuń</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <nav th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/transfers(page=${currentPage - 1})}">‹</a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:text="${i + 1}" th:href="@{/transfers(page=${i})}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/transfers(page=${currentPage + 1})}">›</a>
            </li>
        </ul>
    </nav>

</div>

</body>
</html>
