<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Nowy przelew</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
          crossorigin="anonymous">
</head>
<body>

<div th:insert="~{fragments/navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">

                    <h1 class="h4 text-center mb-4">🔄 Przelew wewnętrzny</h1>

                    <form th:action="@{/transfers}"
                          th:object="${transfer}"
                          method="POST">

                        <!-- VALUE -->
                        <div class="form-group">
                            <label for="value">Kwota</label>
                            <input id="value"
                                   type="number"
                                   step="0.01"
                                   min="0.01"
                                   th:field="*{value}"
                                   class="form-control"
                                   placeholder="np. 500.00"
                                   required/>
                        </div>
                        <div class="field-error" th:if="${#fields.hasErrors('value')}" th:errors="*{value}"></div>

                        <!-- SOURCE ACCOUNT -->
                        <div class="form-group">
                            <label for="sourceAccountId">Z konta</label>
                            <select id="sourceAccountId"
                                    th:field="*{sourceAccountId}"
                                    class="form-control"
                                    required>
                                <option value="" disabled selected>Wybierz konto źródłowe</option>
                                <option th:each="account : ${accounts}"
                                        th:value="${account.id}"
                                        th:text="${account.name}">
                                </option>
                            </select>
                        </div>
                        <div class="field-error" th:if="${#fields.hasErrors('sourceAccountId')}" th:errors="*{sourceAccountId}"></div>

                        <!-- TARGET ACCOUNT -->
                        <div class="form-group">
                            <label for="targetAccountId">Na konto</label>
                            <select id="targetAccountId"
                                    th:field="*{targetAccountId}"
                                    class="form-control"
                                    required>
                                <option value="" disabled selected>Wybierz konto docelowe</option>
                                <option th:each="account : ${accounts}"
                                        th:value="${account.id}"
                                        th:text="${account.name}">
                                </option>
                            </select>
                        </div>
                        <div class="field-error" th:if="${#fields.hasErrors('targetAccountId')}" th:errors="*{targetAccountId}"></div>

                        <!-- NOTE -->
                        <div class="form-group">
                            <label for="note">Uwagi</label>
                            <input id="note"
                                   type="text"
                                   th:field="*{note}"
                                   class="form-control"
                                   placeholder="np. przelew oszczędności"/>
                        </div>
                        <div class="field-error" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary btn-block">
                                🔄 Zapisz przelew
                            </button>
                            <a th:href="@{/transfers}"
                               class="btn btn-outline-secondary btn-block mt-2">
                                ↩ Anuluj
                            </a>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
